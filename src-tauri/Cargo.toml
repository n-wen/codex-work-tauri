[package]
name = "codex-work"
version = "0.1.0"
description = "Open Codex Desktop — Tauri client"
authors = ["Codex Work"]
edition = "2021"

[lib]
name = "codex_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "process", "rt-multi-thread", "macros", "io-util"] }
dirs = "6"
parking_lot = "0.12"
url = "2"
percent-encoding = "2"
cron = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
