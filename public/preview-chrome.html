<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview Chrome</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1e2e;
        color: #cdd6f4;
        font: 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      #bar {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border-bottom: 1px solid #45475a;
      }
      button {
        width: 30px;
        height: 30px;
        padding: 0;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: #313244;
        color: #cdd6f4;
      }
      button:hover {
        background: #45475a;
      }
      button svg {
        width: 14px;
        height: 14px;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      form {
        flex: 1;
        min-width: 0;
        margin: 0;
        display: flex;
      }
      input {
        flex: 1;
        min-width: 0;
        height: 30px;
        border: 1px solid #45475a;
        border-radius: 8px;
        background: #11111b;
        color: #cdd6f4;
        padding: 0 12px;
        outline: none;
        font: 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        -webkit-user-select: text;
        user-select: text;
      }
      input:focus {
        border-color: #3b82f6;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="back" title="后退" type="button" aria-label="后退">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
      </button>
      <button id="fwd" title="前进" type="button" aria-label="前进">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
      </button>
      <button id="reload" title="刷新" type="button" aria-label="刷新">
        <svg viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-2.6-6.4" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
      <form id="form">
        <input id="url" type="text" spellcheck="false" autocomplete="off" />
      </form>
    </div>
    <script>
      (function () {
        var sessionId = window.__CW_PREVIEW_SESSION || 'draft';
        var input = document.getElementById('url');
        input.value = window.__CW_PREVIEW_URL || '';

        function api() {
          return window.__TAURI__;
        }

        function normalizeUrl(raw) {
          var t = (raw || '').trim();
          if (!t) return '';
          if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(t)) return t;
          var host = t.split('/')[0].split(':')[0].toLowerCase();
          var loopback =
            host === 'localhost' ||
            host === '127.0.0.1' ||
            host === '0.0.0.0' ||
            host === '::1';
          return (loopback ? 'http' : 'https') + '://' + t;
        }

        async function invoke(cmd, args) {
          var t = api();
          if (!t || !t.core || !t.core.invoke) throw new Error('tauri api missing');
          return t.core.invoke(cmd, args);
        }

        // Keep arrow keys as caret movement only — never insert glyph characters.
        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            e.stopPropagation();
          }
        });

        document.getElementById('back').onclick = function () {
          invoke('preview_content_back', { sessionId: sessionId }).catch(console.error);
        };
        document.getElementById('fwd').onclick = function () {
          invoke('preview_content_forward', { sessionId: sessionId }).catch(console.error);
        };
        document.getElementById('reload').onclick = function () {
          invoke('preview_content_reload', { sessionId: sessionId }).catch(console.error);
        };
        document.getElementById('form').onsubmit = function (e) {
          e.preventDefault();
          var next = normalizeUrl(input.value);
          if (!next) return;
          invoke('preview_content_navigate', { sessionId: sessionId, url: next }).catch(
            console.error,
          );
        };

        async function bindListen() {
          var t = api();
          if (!t || !t.event || !t.event.listen) return;
          await t.event.listen('preview-url-changed', function (event) {
            var p = event.payload || {};
            if (p.sessionId !== sessionId) return;
            if (typeof p.url === 'string' && document.activeElement !== input) {
              input.value = p.url;
            }
          });
        }
        bindListen().catch(console.error);
      })();
    </script>
  </body>
</html>
